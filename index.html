<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ডট গেম (Dots & Boxes)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #020617 75%);
      color: #f8fafc;
      min-height: 100vh;
      user-select: none;
    }
    .glass {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    .edge-hit {
      cursor: pointer;
    }
    .edge-hit:hover .edge-preview {
      opacity: 0.55;
    }
    .edge-preview {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

  <!-- Header -->
  <header class="w-full max-w-xl flex items-center justify-between mb-4">
    <div>
      <h1 class="text-xl font-bold text-white">ডট গেম (Dots &amp; Boxes)</h1>
      <p class="text-xs text-slate-400">আপনি: <span class="text-purple-400 font-semibold">বেগুনী</span> • কম্পিউটার: <span class="text-yellow-400 font-semibold">হলুদ</span></p>
    </div>
    <button onclick="toggleSound()" class="glass px-3 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:bg-slate-800 transition">
      <span id="soundIcon">🔊</span> সাউন্ড
    </button>
  </header>

  <!-- Lobby Screen -->
  <section id="lobbyScreen" class="w-full max-w-md glass rounded-2xl p-6 shadow-2xl">
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">আপনার নাম</label>
      <input id="playerNameInput" type="text" maxlength="16" placeholder="যেমন: সাকিব"
        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500" />
    </div>

    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-300 mb-2">বোর্ডের সাইজ</label>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="setGrid(3,3)" id="grid-3" class="py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700">৩ × ৩</button>
        <button type="button" onclick="setGrid(4,4)" id="grid-4" class="py-2 rounded-xl text-xs font-bold bg-purple-600 text-white border border-purple-400">৪ × ৪</button>
        <button type="button" onclick="setGrid(5,5)" id="grid-5" class="py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700">৫ × ৫</button>
      </div>
    </div>

    <button type="button" onclick="startGame()"
      class="w-full py-3 rounded-xl font-bold text-sm sm:text-base bg-gradient-to-r from-purple-600 to-yellow-500 hover:from-purple-500 hover:to-yellow-400 text-white shadow-lg transition">
      🤖 কম্পিউটারের সাথে খেলা শুরু করুন
    </button>
  </section>

  <!-- Game Screen -->
  <section id="gameScreen" class="hidden w-full max-w-xl flex flex-col items-center">
    <div class="w-full grid grid-cols-3 gap-2.5 mb-3">
      <!-- Player 1 (Purple) -->
      <div id="p1Card" class="glass rounded-2xl p-3 border-2 border-purple-500">
        <div class="flex items-center justify-between text-xs text-purple-300 font-semibold mb-1">
          <span id="p1Name">আপনি</span>
          <span class="w-3 h-3 rounded-full bg-purple-500"></span>
        </div>
        <div id="p1Score" class="text-2xl sm:text-3xl font-extrabold text-purple-400">0</div>
      </div>

      <!-- Turn Status -->
      <div class="flex flex-col items-center justify-center text-center">
        <div id="turnBadge" class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-purple-500/20 text-purple-300 border border-purple-500/40">
          আপনার চাল
        </div>
      </div>

      <!-- Player 2 / Computer (Yellow) -->
      <div id="p2Card" class="glass rounded-2xl p-3 border-2 border-transparent">
        <div class="flex items-center justify-between text-xs text-yellow-300 font-semibold mb-1">
          <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
          <span>কম্পিউটার</span>
        </div>
        <div id="p2Score" class="text-2xl sm:text-3xl font-extrabold text-yellow-400 text-right">0</div>
      </div>
    </div>

    <!-- SVG Board -->
    <div class="w-full glass rounded-2xl p-4 flex items-center justify-center shadow-2xl">
      <svg id="boardSvg" class="w-full h-auto max-h-[62vh] select-none overflow-visible" viewBox="0 0 400 400"></svg>
    </div>

    <!-- Bottom Buttons -->
    <div class="w-full flex items-center justify-between gap-3 mt-3">
      <button type="button" onclick="backToLobby()" class="glass px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-300 hover:bg-slate-800 transition">
        ← লবি
      </button>
      <button type="button" onclick="restartGame()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-purple-600 hover:bg-purple-500 text-white transition">
        🔄 আবার খেলুন
      </button>
    </div>
  </section>

  <!-- Result Modal -->
  <div id="resultModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-6 max-w-sm w-full text-center border border-slate-700">
      <div id="resultEmoji" class="text-5xl mb-2">🏆</div>
      <h2 class="text-2xl font-extrabold text-white mb-1">খেলা শেষ!</h2>
      <p id="resultText" class="text-sm text-slate-300 mb-5"></p>
      <div class="flex gap-2.5">
        <button type="button" onclick="backToLobby()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200">লবি</button>
        <button type="button" onclick="restartGame()" class="flex-1 py-2.5 rounded-xl text-sm font-bold bg-purple-600 hover:bg-purple-500 text-white">আবার খেলুন</button>
      </div>
    </div>
  </div>

  <script>
    const PURPLE = '#a855f7';
    const PURPLE_FILL = 'rgba(168, 85, 247, 0.25)';
    const YELLOW = '#eab308';
    const YELLOW_FILL = 'rgba(234, 179, 8, 0.25)';

    let rows = 4;
    let cols = 4;
    let hEdges = {};
    let vEdges = {};
    let boxes = {};
    let turn = 1; // 1 = আপনি (বেগুনী), 2 = কম্পিউটার (হলুদ)
    let scores = { 1: 0, 2: 0 };
    let gameOver = false;
    let aiTimer = null;
    let soundOn = true;
    let p1Name = 'আপনি';

    let audioCtx = null;
    function beep(freq, dur = 0.08) {
      if (!soundOn) return;
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.1;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('soundIcon').textContent = soundOn ? '🔊' : '🔇';
    }

    function setGrid(r, c) {
      rows = r;
