<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ডট গেম</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Hind Siliguri', sans-serif, Arial;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .box {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      text-align: center;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 18px;
    }
    .purple { color: #a855f7; font-weight: bold; }
    .yellow { color: #eab308; font-weight: bold; }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0b1120;
      color: #fff;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .size-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .size-btn {
      background: #1f2937;
      color: #e5e7eb;
    }
    .size-btn.active {
      background: #a855f7;
      color: #fff;
    }
    .start-btn {
      width: 100%;
      background: linear-gradient(90deg, #a855f7, #eab308);
      color: #090d16;
      font-size: 15px;
    }
    #gameArea { display: none; width: 100%; max-width: 460px; }
    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .score-box {
      background: #111827;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .score-box.p1.active { border-color: #a855f7; }
    .score-box.p2.active { border-color: #eab308; }
    .score-num { font-size: 24px; font-weight: 800; }
    .p1 .score-num { color: #a855f7; }
    .p2 .score-num { color: #eab308; text-align: right; }
    .p2 { text-align: right; }
    .turn-box {
      font-size: 13px;
      font-weight: bold;
      padding: 7px 12px;
      border-radius: 999px;
      background: #1f2937;
      text-align: center;
    }
    canvas {
      width: 100%;
      height: auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      display: block;
      cursor: pointer;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }
    .sec-btn { background: #1f2937; color: #f8fafc; }
    .msg {
      margin-top: 12px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #fde047;
      min-height: 22px;
    }
  </style>
</head>
<body>

  <div id="lobbyArea" class="box">
    <h1>ডট গেম</h1>
    <div class="sub">আপনি: <span class="purple">বেগুনী</span> • কম্পিউটার: <span class="yellow">হলুদ</span></div>

    <label for="nameInput">আপনার নাম</label>
    <input id="nameInput" type="text" placeholder="যেমন: সাকিব" />

    <label>বোর্ডের সাইজ</label>
    <div class="size-row">
      <button type="button" class="size-btn" onclick="pickSize(3, this)">৩ × ৩</button>
      <button type="button" class="size-btn active" onclick="pickSize(4, this)">৪ × ৪</button>
      <button type="button" class="size-btn" onclick="pickSize(5, this)">৫ × ৫</button>
    </div>

    <button type="button" class="start-btn" onclick="beginGame()">কম্পিউটারের সাথে খেলা শুরু করুন</button>
  </div>

  <div id="gameArea">
    <div class="top-bar">
      <div id="card1" class="score-box p1 active">
        <div id="labelP1" style="font-size:12px;color:#d8b4fe;">আপনি</div>
        <div id="score1" class="score-num">0</div>
      </div>
      <div id="turnText" class="turn-box">আপনার চাল</div>
      <div id="card2" class="score-box p2">
        <div style="font-size:12px;color:#fef08a;">কম্পিউটার</div>
        <div id="score2" class="score-num">0</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="420" height="420"></canvas>
    <div id="statusMsg" class="msg"></div>

    <div class="bottom-bar">
      <button type="button" class="sec-btn" onclick="goLobby()">← লবি</button>
      <button type="button" class="sec-btn" onclick="resetMatch()">🔄 আবার খেলুন</button>
    </div>
  </div>

  <script>
    const PURPLE = '#a855f7';
    const PURPLE_BG = 'rgba(168, 85, 247, 0.25)';
    const YELLOW = '#eab308';
    const YELLOW_BG = 'rgba(234, 179, 8, 0.25)';

    let size = 4;
    let hLines = {};
    let vLines = {};
    let claimed = {};
    let currentPlayer = 1; // 1 = আপনি (বেগুনী), 2 = কম্পিউটার (হলুদ)
    let scores = { 1: 0, 2: 0 };
    let ended = false;
    let aiWait = null;
    let playerName = 'আপনি';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function pickSize(n, btn) {
      size = n;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function beginGame() {
      const val = document.getElementById('nameInput').value.trim();
      playerName = val || 'আপনি';
      document.getElementById('labelP1').textContent = playerName;
      document.getElementById('lobbyArea').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';
      resetMatch();
    }

    function goLobby() {
      clearTimeout(aiWait);
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('lobbyArea').style.display = 'block';
    }

    function resetMatch() {
      clearTimeout(aiWait);
      hLines = {};
      vLines = {};
      claimed = {};
      currentPlayer = 1;
      scores = { 1: 0, 2: 0 };
      ended = false;
      document.getElementById('statusMsg').textContent = '';
      updateHeader();
      drawBoard();
    }

    function sidesAround(r, c) {
      if (r < 0 || r >= size || c < 0 || c >= size) return 0;
      let count = 0;
      if (hLines[r + ',' + c]) count++;
      if (hLines[(r + 1) + ',' + c]) count++;
      if (vLines[r + ',' + c]) count++;
      if (vLines[r + ',' + (c + 1)]) count++;
      return count;
    }

    function checkBoxes(type, r, c, who) {
      let got = 0;
      const checkOne = (br, bc) => {
        if (br < 0 || br >= size || bc < 0 || bc >= size) return;
        const key = br + ',' + bc;
        if (!claimed[key] && sidesAround(br, bc) === 4) {
          claimed[key] = who;
          scores[who]++;
          got++;
        }
      };
      if (type === 'h') {
        checkOne(r - 1, c);
        checkOne(r, c);
      } else {
        checkOne(r, c - 1);
        checkOne(r, c);
      }
      return got;
    }

    function playMove(type, r, c, who) {
      if (ended) return;
      const key = r + ',' + c;
      if (type === 'h' && hLines[key]) return;
      if (type === 'v' && vLines[key]) return;

      if (type === 'h') hLines[key] = who;
      else vLines[key] = who;

      const got = checkBoxes(type, r, c, who);

      if (Object.keys(claimed).length === size * size) {
        ended = true;
        updateHeader();
        drawBoard();
        const msg = document.getElementById('statusMsg');
        if (scores[1] > scores[2]) msg.textContent = playerName + ' জিতেছেন! (' + scores[1] + ' - ' + scores[2] + ')';
        else if (scores[2] > scores[1]) msg.textContent = 'কম্পিউটার জিতেছে! (' + scores[2] + ' - ' + scores[1] + ')';
        else msg.textContent = 'খেলা ড্র হয়েছে! (' + scores[1] + ' - ' + scores[2] + ')';
        return;
      }

      if (got === 0) {
        currentPlayer = who === 1 ? 2 : 1;
      }

      updateHeader();
      drawBoard();

      if (!ended && currentPlayer === 2) {
        aiWait = setTimeout(doComputerMove, 1000);
      }
    }

    function doComputerMove() {
      if (ended || currentPlayer !== 2) return;
      const openMoves = [];
      for (let r = 0; r <= size; r++) {
        for (let c = 0; c < size; c++) {
          if (!hLines[r + ',' + c]) openMoves.push({ type: 'h', r, c });
        }
      }
      for (let r = 0; r < size; r++) {
        for (let c = 0; c <= size; c++) {
          if (!vLines[r + ',' + c]) openMoves.push({ type: 'v', r, c });
        }
      }
      if (!openMoves.length) return;

      let pick = null;
      for (const m of openMoves) {
        if (m.type === 'h') hLines[m.r + ',' + m.c] = 2;
        else vLines[m.r + ',' + m.c] = 2;

        const completes =
          (m.type === 'h' && (sidesAround(m.r - 1, m.c) === 4 || sidesAround(m.r, m.c) === 4)) ||
          (m.type === 'v' && (sidesAround(m.r, m.c - 1) === 4 || sidesAround(m.r, m.c) === 4));

        if (m.type === 'h') delete hLines[m.r + ',' + m.c];
        else delete vLines[m.r + ',' + m.c];

        if (completes) {
          pick = m;
          break;
        }
      }

      if (!pick) {
        pick = openMoves[Math.floor(Math.random() * openMoves.length)];
      }
      playMove(pick.type, pick.r, pick.c, 2);
    }

    function getMetrics() {
      const pad = 36;
      const cell = Math.floor((canvas.width - pad * 2) / size);
      return { pad, cell };
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const { pad, cell } = getMetrics();

      // Claimed boxes
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const who = claimed[r + ',' + c];
          if (who) {
            const x = pad + c * cell + 5;
            const y = pad + r * cell + 5;
            const w = cell - 10;
            ctx.fillStyle = who === 1 ? PURPLE_BG : YELLOW_BG;
            ctx.fillRect(x, y, w, w);

            ctx.fillStyle = who === 1 ? '#e9d5ff' : '#fef08a';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(who === 1 ? 'আপনি' : 'AI', x + w / 2, y + w / 2);
          }
        }
      }

      // Horizontal lines
      for (let r = 0; r <= size; r++) {
        for (let c = 0; c < size; c++) {
          const who = hLines[r + ',' + c];
          const x1 = pad + c * cell;
          const y1 = pad + r * cell;
          const x2 = pad + (c + 1) * cell;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y1);
          ctx.lineCap = 'round';
          ctx.strokeStyle = who ? (who === 1 ? PURPLE : YELLOW) : '#334155';
          ctx.lineWidth = who ? 6 : 2;
          ctx.stroke();
        }
      }

      // Vertical lines
      for (let r = 0; r < size; r++) {
        for (let c = 0; c <= size; c++) {
          const who = vLines[r + ',' + c];
          const x1 = pad + c * cell;
          const y1 = pad + r * cell;
          const y2 = pad + (r + 1) * cell;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x1, y2);
          ctx.lineCap = 'round';
          ctx.strokeStyle = who ? (who === 1 ? PURPLE : YELLOW) : '#334155';
          ctx.lineWidth = who ? 6 : 2;
          ctx.stroke();
        }
      }

      // Dots
      for (let r = 0; r <= size; r++) {
        for (let c = 0; c <= size; c++) {
          ctx.beginPath();
          ctx.arc(pad + c * cell, pad + r * cell, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }
      }
    }

    function distPointToSeg(px, py, x1, y1, x2, y2) {
      const lenSq = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (!lenSq) return Math.hypot(px - x1, py - y1);
      const t = Math.max(0, Math.min(1, ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / lenSq));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    canvas.addEventListener('click', (e) => {
      if (ended || currentPlayer !== 1) return;
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (canvas.width / rect.width);
      const py = (e.clientY - rect.top) * (canvas.height / rect.height);
      const { pad, cell } = getMetrics();

      let best = null;
      let minDist = 16;

      for (let r = 0; r <= size; r++) {
        for (let c = 0; c < size; c++) {
          if (hLines[r + ',' + c]) continue;
          const d = distPointToSeg(px, py, pad + c * cell, pad + r * cell, pad + (c + 1) * cell, pad + r * cell);
          if (d < minDist) { minDist = d; best = { type: 'h', r, c }; }
        }
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c <= size; c++) {
          if (vLines[r + ',' + c]) continue;
          const d = distPointToSeg(px, py, pad + c * cell, pad + r * cell, pad + c * cell, pad + (r + 1) * cell);
          if (d < minDist) { minDist = d; best = { type: 'v', r, c }; }
        }
      }

      if (best) playMove(best.type, best.r, best.c, 1);
    });

    function updateHeader() {
      document.getElementById('score1').textContent = scores[1];
      document.getElementById('score2').textContent = scores[2];
      document.getElementById('card1').classList.toggle('active', !ended && currentPlayer === 1);
      document.getElementById('card2').classList.toggle('active', !ended && currentPlayer === 2);

      const turnEl = document.getElementById('turnText');
      if (ended) {
        turnEl.textContent = 'খেলা শেষ';
        turnEl.style.color = '#86efac';
      } else if (currentPlayer === 1) {
        turnEl.textContent = 'আপনার চাল';
        turnEl.style.color = '#d8b4fe';
      } else {
        turnEl.textContent = 'কম্পিউটার চাল দিচ্ছে...';
        turnEl.style.color = '#fef08a';
      }
    }
  </script>
</body>
</html>
